# 안드로이드 APK를 빌드해서 GitHub 릴리즈(시험판)에 올린다.
# 손으로만 돌린다: Actions 탭 → "APK 릴리즈" → Run workflow.
# (커밋 메시지마다 [skip ci]를 붙이므로 push나 태그로는 돌지 않게 했다)
#
# 서명: 기본은 빌드할 때마다 새 디버그 키를 만든다. 노트북에서 만든 APK와 키가 달라서
# 폰에 깔린 것 위에 덮어 깔리지 않는다(지우고 깔아야 함).
# 노트북 키로 서명하려면 레포 Settings → Secrets → Actions에 직접 넣는다:
#   ANDROID_DEBUG_KEYSTORE_B64  디버그 키스토어 파일을 base64로 바꾼 글
#   ANDROID_DEBUG_KEYSTORE_PASS 그 비밀번호 (없으면 Godot 기본값 android)
name: APK 릴리즈

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리즈 태그 (비우면 v<버전>-<날짜>-<커밋>)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot와 내보내기 템플릿 받기
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* "$tdir"/
          rm -rf templates *.zip *.tpz

      - name: 서명 키와 에디터 설정
        env:
          KEY_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASS }}
        run: |
          ks=$HOME/debug.keystore
          pass="${KEY_PASS:-android}"
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$ks"
            echo "Secrets의 디버그 키로 서명"
          else
            keytool -genkeypair -v -keystore "$ks" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 >/dev/null
            pass=android
            echo "새 디버그 키로 서명 (폰에 깔린 노트북 APK 위에는 덮어 깔리지 않음)"
          fi
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "$pass"
          EOF

      - name: 리소스 가져오기
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true

      - name: 테스트
        run: |
          godot --headless --path . --script res://tests/run_tests.gd | tee test.log
          grep -q " 0 실패" test.log

      - name: APK 내보내기
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/out.apk
          test -s build/android/out.apk
          ver=$(grep -m1 '^version/name=' export_presets.cfg | cut -d'"' -f2)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="v${ver}-$(date +%m%d)-${GITHUB_SHA::7}"; fi
          echo "TAG=$tag" >> $GITHUB_ENV
          mv build/android/out.apk "build/android/oneului-bada-${tag}.apk"

      - name: 릴리즈 (시험판)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 오늘의 바다 ${{ env.TAG }} (시험판)
          prerelease: true
          body: |
            폰 시험용 디버그 빌드입니다. 커밋 ${{ github.sha }}
            APK를 받아 안드로이드 폰에 설치합니다 (출처를 알 수 없는 앱 허용 필요).
          files: build/android/oneului-bada-*.apk
