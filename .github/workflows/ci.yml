# 테스트와 웹 빌드. 회사 PC처럼 Godot가 없는 곳에서도 결과를 확인하려고 둔다.
# 사용량을 줄이려고 게임 코드가 바뀐 push/PR에서만 테스트하고, 웹 빌드는 손으로 돌릴 때만 한다.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "scenes/**"
      - "tests/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      web_build:
        description: "웹 빌드도 만들기 (Actions 탭 결과에서 zip으로 받음)"
        type: boolean
        default: false

# 같은 브랜치에서 새로 돌면 앞의 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Godot 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot 설치
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: 리소스 가져오기
        run: ~/godot/godot --headless --path . --import

      - name: 테스트
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

  web:
    if: github.event_name == 'workflow_dispatch' && inputs.web_build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Godot와 웹 템플릿 캐시
        id: tpl-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Godot와 웹 템플릿 설치
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL"
          curl -sSL -o /tmp/tpl.tpz "$URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -joq /tmp/tpl.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$TPL"

      - name: 웹 빌드
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --import
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
